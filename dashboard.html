<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CardioWatch BR · IAM em Adultos Jovens</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--border:#E4E8EF;--border2:#D0D6E0;
  --text1:#111827;--text2:#374151;--text3:#6B7280;--text4:#9CA3AF;
  --red:#C9373A;--blue:#2461C8;--green:#059669;--amber:#D97706;--purple:#7C3AED;
  --radius:8px;--radius-lg:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06);
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text1);
  font-size:13px;
}

/* Layout */
.content{
  padding:16px 20px;
  max-width:1200px;
  margin:0 auto;
}

/* KPI ROW */
.kpi-row{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:8px;
  margin-bottom:12px;
}

/* KPI CARD */
.kpi-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  box-shadow:var(--shadow);
}

/* Header KPI */
.kpi-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:6px;
}

.kpi-label{
  font-size:10px;
  color:var(--text3);
  text-transform:uppercase;
  max-width:110px;
}

/* Ícone */
.kpi-icon{
  width:22px;
  height:22px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.kpi-icon svg{
  width:12px;
  height:12px;
}

/* Valor */
.kpi-value{
  font-size:18px;
  font-weight:700;
  margin-bottom:4px;
}

/* Footer */
.kpi-footer{
  display:flex;
  gap:4px;
  align-items:center;
}

.kpi-delta{
  font-size:10px;
  padding:2px 5px;
  border-radius:4px;
}

.kpi-period{
  font-size:10px;
  color:var(--text4);
}

/* Sparkline */
.spark{
  height:20px;
  margin-top:4px;
}

/* Cores */
.red{color:var(--red)}
.blue{color:var(--blue)}
.amber{color:var(--amber)}
.purple{color:var(--purple)}
</style>
</head>

<body>

<div class="content">

<div class="kpi-row">

<!-- CARD 1 -->
<div class="kpi-card">
  <div class="kpi-top">
    <div class="kpi-label">Internações IAM Jovens</div>
    <div class="kpi-icon">
      <svg viewBox="0 0 24 24">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    </div>
  </div>

  <div class="kpi-value red">+38%</div>

  <div class="kpi-footer">
    <span class="kpi-delta red">▲ +38%</span>
    <span class="kpi-period">vs 2000</span>
  </div>

  <canvas class="spark"></canvas>
</div>

<!-- CARD 2 -->
<div class="kpi-card">
  <div class="kpi-top">
    <div class="kpi-label">Mortalidade &gt;60</div>
    <div class="kpi-icon">
      <svg viewBox="0 0 24 24">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
      </svg>
    </div>
  </div>

  <div class="kpi-value blue">−6%</div>

  <div class="kpi-footer">
    <span class="kpi-delta blue">▼ −6%</span>
    <span class="kpi-period">queda</span>
  </div>

  <canvas class="spark"></canvas>
</div>

<!-- CARD 3 -->
<div class="kpi-card">
  <div class="kpi-top">
    <div class="kpi-label">Obesidade Jovens</div>
    <div class="kpi-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 9v4"/>
      </svg>
    </div>
  </div>

  <div class="kpi-value amber">+127%</div>

  <div class="kpi-footer">
    <span class="kpi-delta amber">▲ +127%</span>
    <span class="kpi-period">2006–22</span>
  </div>

  <canvas class="spark"></canvas>
</div>

<!-- CARD 4 -->
<div class="kpi-card">
  <div class="kpi-top">
    <div class="kpi-label">Índice Rejuvenescimento</div>
    <div class="kpi-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
      </svg>
    </div>
  </div>

  <div class="kpi-value purple">1,42</div>

  <div class="kpi-footer">
    <span class="kpi-delta purple">▲ +0,41</span>
    <span class="kpi-period">razão</span>
  </div>

  <canvas class="spark"></canvas>
</div>

</div>

</div>

</body>
</html>
